<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Korckyjals-CODE — El Salvador consultancy for practical software, automation, and learning tools. Est. 2018."
    />
    <meta name="theme-color" content="#0b1210" />
    <meta property="og:title" content="Korckyjals-CODE" />
    <meta
      property="og:description"
      content="El Salvador consultancy for practical software, automation, and learning tools."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://korckyjals-code.com/" />
    <link rel="canonical" href="https://korckyjals-code.com/" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <title>Korckyjals-CODE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="atmosphere" aria-hidden="true">
      <div class="atmosphere__grid"></div>
      <div class="atmosphere__glow"></div>
    </div>

    <header class="site-header" id="top">
      <div class="shell header__inner">
        <a class="brand" href="#top" data-bind="brand">Korckyjals-CODE</a>

        <nav class="nav" aria-label="Primary" data-nav>
          <ul class="nav__list" data-nav-list></ul>
        </nav>

        <div class="header__controls">
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" class="chip" data-lang="en" aria-pressed="true">
              EN
            </button>
            <button type="button" class="chip" data-lang="es" aria-pressed="false">
              ES
            </button>
          </div>
          <button
            type="button"
            class="icon-btn"
            data-theme-toggle
            aria-label="Switch to light theme"
          >
            <span class="icon-btn__sun" aria-hidden="true"></span>
            <span class="icon-btn__moon" aria-hidden="true"></span>
          </button>
          <button
            type="button"
            class="icon-btn menu-toggle"
            data-menu-toggle
            aria-expanded="false"
            aria-controls="mobile-nav"
            aria-label="Open menu"
          >
            <span class="menu-toggle__bars" aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <nav
        id="mobile-nav"
        class="mobile-nav"
        data-mobile-nav
        hidden
        aria-label="Mobile"
      >
        <ul class="mobile-nav__list" data-mobile-nav-list></ul>
      </nav>
    </header>

    <main id="main">
      <noscript>
        <section class="shell noscript-fallback">
          <p class="eyebrow">Consultancy · Est. 2018</p>
          <h1>Korckyjals-CODE</h1>
          <p>
            El Salvador consultancy for practical software, automation, and
            learning tools. Enable JavaScript to load the full portfolio from
            <code>content.json</code>.
          </p>
          <p>
            Contact:
            <a href="mailto:info@korckyjals-code.com"
              >info@korckyjals-code.com</a
            >
          </p>
          <p>
            <a href="https://github.com/Korckyjals-CODE"
              >GitHub organization</a
            >
            ·
            <a href="https://anselmobot.com">AnselmoBot</a>
          </p>
        </section>
      </noscript>

      <div data-app class="app-root" aria-busy="true">
        <p class="shell status" data-status>Loading portfolio…</p>
      </div>
    </main>

    <script src="js/app.js" defer></script>
  </body>
</html>
